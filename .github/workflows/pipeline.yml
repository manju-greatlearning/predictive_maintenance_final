name: Predictive Maintenance Final MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Register and validate dataset
        run: python src/validate_dataset.py

      - name: Clean data and create train/test splits
        run: python src/prepare_data.py

      - name: Upload train/test splits as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-test-splits
          path: |
            data/train.csv
            data/test.csv
            data/cleaned.csv

  train-evaluate-deploy-check:
    needs: validate-prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download train/test splits artifact
        uses: actions/download-artifact@v4
        with:
          name: train-test-splits
          path: data/

      - name: Tune, evaluate and save best model
        run: python src/train.py

      - name: Smoke test Streamlit app imports
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import joblib
          model_path = Path('models/best_model.joblib')
          assert model_path.exists(), 'best_model.joblib missing'
          joblib.load(model_path)
          assert Path('app.py').exists(), 'app.py missing'
          assert importlib.util.find_spec('streamlit') is not None, 'streamlit missing'
          print('Streamlit deployment smoke test passed')
          PY

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-and-metrics
          path: |
            models/best_model.joblib
            models/metrics.json

      - name: Commit generated pipeline outputs to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cleaned.csv data/train.csv data/test.csv models/best_model.joblib models/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Update predictive maintenance pipeline outputs [skip ci]"
            git push
          fi
